<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Adaptra.AI 4.5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#060914;--panel:#0d1422;--border:#263650;--text:#f5f7ff;--muted:#8b98ad;
  --blue:#536dff;--purple:#8b5cf6;--green:#35d58a;--danger:#ff5571;
  --bubble-ai:#121d30;--bubble-user:linear-gradient(135deg,#4b68ed,#7459e9);
  --input-bg:#0c1220;--card-bg:rgba(14,23,39,.8);
}
[data-theme="light"]{
  --bg:#f4f6fa;--panel:#ffffff;--border:#d0d7de;--text:#1f2328;--muted:#57606a;
  --blue:#0969da;--purple:#8250df;--green:#1a7f37;--danger:#cf222e;
  --bubble-ai:#eaeef2;--bubble-user:linear-gradient(135deg,#0969da,#8250df);
  --input-bg:#ffffff;--card-bg:#ffffff;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;transition:background .3s,color .3s}
button,textarea{font:inherit}button{cursor:pointer}
.app{width:100%;height:100dvh;max-width:1000px;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 15% 0%,rgba(83,109,255,.18),transparent 32%),radial-gradient(circle at 90% 18%,rgba(139,92,246,.13),transparent 30%),var(--bg)}
.header{height:66px;flex:0 0 66px;display:flex;align-items:center;justify-content:space-between;padding:max(8px,env(safe-area-inset-top)) 12px 7px;background:rgba(6,9,20,.88);border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(18px);z-index:20}
[data-theme="light"] .header{background:rgba(255,255,255,.88);border-bottom:1px solid rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;font-size:19px;font-weight:950;color:white;background:linear-gradient(135deg,#536dff,#8b5cf6);box-shadow:0 8px 28px rgba(83,109,255,.28)}.brand-name{font-size:16px;font-weight:850}.brand-name b{color:#8092ff}.version{color:#66748c;font-size:9px;margin-left:3px}.status{margin-top:2px;color:var(--muted);font-size:10px;font-weight:700}
.header-actions{display:flex;gap:7px}.icon-btn{width:40px;height:40px;border:1px solid var(--border);border-radius:13px;background:rgba(17,26,43,.8);color:#e8edfa;display:grid;place-items:center;font-size:17px}.icon-btn:active{transform:scale(.94)}
[data-theme="light"] .icon-btn{background:#f0f3f6;color:#24292f}
.chat{flex:1;min-height:0;overflow-y:auto;padding:16px 11px 175px;scroll-behavior:smooth}.chat::-webkit-scrollbar{width:4px}.chat::-webkit-scrollbar-thumb{background:#26344c;border-radius:20px}
.welcome{max-width:720px;margin:10px auto 22px;padding:21px;border-radius:24px;border:1px solid rgba(110,130,255,.18);background:linear-gradient(145deg,rgba(20,30,52,.94),rgba(9,14,26,.96));box-shadow:0 25px 70px rgba(0,0,0,.25)}
[data-theme="light"] .welcome{background:#ffffff;border:1px solid #d0d7de;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.welcome-top{display:flex;align-items:center;gap:12px}.welcome-icon{width:45px;height:45px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,rgba(83,109,255,.22),rgba(139,92,246,.2));border:1px solid rgba(120,140,255,.18)}.welcome h1{margin:0;font-size:23px}.welcome h1 span{color:#8190ff}.welcome p{color:var(--muted);line-height:1.55;font-size:14px;margin:12px 0 0}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:17px}.quick{padding:12px;border:1px solid var(--border);border-radius:15px;text-align:left;background:var(--card-bg);color:var(--text);transition:.15s}.quick:active{transform:scale(.98)}.quick strong{display:block;margin-top:4px}.quick small{display:block;margin-top:3px;color:var(--muted)}
.message-row{display:flex;gap:8px;width:100%;margin:13px 0;animation:messageIn .18s ease-out}.message-row.user{justify-content:flex-end}.avatar{width:35px;height:35px;min-width:35px;display:grid;place-items:center;border-radius:12px;font-weight:900;background:linear-gradient(135deg,#536dff,#8b5cf6);box-shadow:0 7px 22px rgba(83,109,255,.18)}.user .avatar{order:2}
.bubble{max-width:min(84%,700px);padding:12px 14px;border-radius:18px;border:1px solid rgba(255,255,255,.06);background:var(--bubble-ai);color:var(--text);line-height:1.55;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 8px 25px rgba(0,0,0,.12)}
[data-theme="light"] .bubble{border:1px solid #d0d7de}
.ai .bubble{border-top-left-radius:7px}.user .bubble{border-top-right-radius:7px;background:var(--bubble-user);color:white}
.thinking{display:flex;align-items:center;gap:4px;width:max-content;padding:4px 2px}.thinking span{width:6px;height:6px;border-radius:50%;background:#8292ff;animation:thinking 1.15s infinite ease-in-out}.thinking span:nth-child(2){animation-delay:.15s}.thinking span:nth-child(3){animation-delay:.3s}
@keyframes thinking{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-4px)}}@keyframes messageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.generated-image{display:block;width:100%;max-width:520px;margin-top:8px;border-radius:17px;border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 55px rgba(0,0,0,.4)}

/* Code block styling with copy button */
.code-block-wrapper{position:relative;margin:10px 0;background:#030712;border-radius:8px;overflow:hidden;border:1px solid #1e293b}
.code-header{display:flex;justify-content:space-between;align-items:center;background:#0f172a;padding:6px 12px;font-size:12px;color:#94a3b8}
.copy-code-btn{background:#1e293b;border:none;color:#cbd5e1;padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer}
.copy-code-btn:hover{background:#334155}
.code-block-wrapper pre{margin:0;padding:12px;overflow-x:auto;color:#e2e8f0;font-family:monospace;font-size:13px}

.composer-wrap{position:fixed;left:0;right:0;bottom:0;z-index:50;pointer-events:none}.composer{width:min(1000px,100%);margin:auto;padding:7px 9px max(8px,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(6,9,20,.99),rgba(6,9,20,.9),transparent);pointer-events:auto}
[data-theme="light"] .composer{background:linear-gradient(to top,rgba(244,246,250,.99),rgba(244,246,250,.9),transparent)}
.composer-box{display:flex;align-items:flex-end;gap:6px;padding:7px;border-radius:22px;border:1px solid var(--border);background:var(--input-bg);box-shadow:0 15px 50px rgba(0,0,0,.15)}
.attach-btn,.voice-btn,.send-btn{width:43px;height:43px;min-width:43px;border-radius:15px;border:1px solid var(--border);display:grid;place-items:center;color:var(--text)}.attach-btn,.voice-btn{background:var(--panel)}.send-btn{border:0;background:linear-gradient(135deg,#536dff,#8b5cf6);color:white;font-size:18px;box-shadow:0 8px 25px rgba(83,109,255,.22)}.send-btn.stop{background:var(--danger)}
textarea{flex:1;min-width:0;min-height:43px;max-height:130px;padding:11px 5px;border:0;outline:0;resize:none;background:transparent;color:var(--text);font-size:15px;line-height:21px;overflow-y:auto}textarea::placeholder{color:var(--muted)}
.tools{display:flex;gap:6px;margin-top:7px;overflow-x:auto;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.tool{flex:0 0 auto;padding:7px 10px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:11px}.tool.active{color:var(--text);border-color:var(--blue);background:var(--card-bg)}
.toast{position:fixed;left:50%;bottom:112px;transform:translate(-50%,15px);max-width:90%;padding:10px 14px;border-radius:13px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}
.menu-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:70}.menu-bg.open{display:block}
.menu{position:fixed;left:0;top:0;bottom:0;width:min(320px,88vw);padding:max(18px,env(safe-area-inset-top)) 16px;background:var(--panel);border-right:1px solid var(--border);transform:translateX(-105%);transition:.25s;z-index:80;box-shadow:15px 0 60px rgba(0,0,0,.35);overflow-y:auto}.menu.open{transform:translateX(0)}
.menu-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.menu-title{font-size:20px;font-weight:900}
.menu-section-title{font-size:11px;color:var(--muted);text-transform:uppercase;margin:15px 0 5px 5px;letter-spacing:1px}
.menu-item{width:100%;display:flex;align-items:center;gap:10px;padding:11px 13px;margin:4px 0;border:0;border-radius:13px;background:transparent;color:var(--text);text-align:left;font-size:14px}.menu-item:hover{background:var(--card-bg)}
@media(max-width:600px){.brand-name{font-size:15px}.chat{padding:13px 9px 175px}.welcome{padding:18px}.bubble{max-width:89%}}@media(max-width:390px){.quick-grid{grid-template-columns:1fr}.bubble{max-width:92%}}
</style>
</head>
<body data-theme="dark">
<div class="app">
<header class="header">
<div class="brand"><div class="logo">A</div><div><div class="brand-name">Adaptra<b>.AI</b><span class="version">4.5</span></div><div class="status" id="status">● conectando</div></div></div>
<div class="header-actions">
<button class="icon-btn" id="themeToggleBtn" title="Alternar Tema">☀️</button>

</div>
</header>

<main class="chat" id="chat">
<section class="welcome" id="welcome">
<div class="welcome-top"><div class="welcome-icon">✨</div><div><h1>Olá, <span>Jheymison</span> 👋</h1></div></div>
<p>Eu sou a Adaptra.AI 4.5. Posso conversar, ajudar com programação, projetos, ideias e criação de imagens.</p>
<div class="quick-grid">
<button class="quick" data-msg="Quero criar um projeto novo.">🚀<strong>Criar projeto</strong><small>Começar uma ideia</small></button>

<button class="quick" data-msg="Me dê ideias para um projeto.">💡<strong>Ideias</strong><small>Brainstorm</small></button>

</section>
</main>

<div class="composer-wrap"><div class="composer">
<div class="composer-box">
<button class="attach-btn" id="attachBtn">＋</button>
<textarea id="input" rows="1" placeholder="Converse com a Adaptra..." autocomplete="off"></textarea>

</div>

<button class="tool" id="imageMode">🎨 Imagem</button>

</div>
</div></div>

<div class="menu-bg" id="menuBg"></div>
<aside class="menu" id="menu">
<div class="menu-header"><div class="menu-title">🤖 Adaptra.AI</div><button class="icon-btn" id="closeMenu">×</button></div>
<button class="menu-item" id="menuNew">💬 Nova conversa</button>
<div class="menu-section-title">Histórico de Chats</div>
<div id="historyList"></div>
<div class="menu-section-title">Opções</div>
<button class="menu-item" id="menuTheme">🌓 Alternar Tema Claro/Escuro</button>
<button class="menu-item" id="menuMemory">🧠 Memória</button>
<button class="menu-item" id="menuCreator">👤 Sobre o criador</button>
<button class="menu-item" id="menuStatus">🟢 Testar backend</button>
</aside>
<div class="toast" id="toast"></div>
</div>

<script>
"use strict";

const API="https://adaptra-backend.onrender.com";
const HISTORY_KEY="adaptra45_history";
const SESSIONS_KEY="adaptra45_sessions";
const THEME_KEY="adaptra45_theme";

const $=id=>document.getElementById(id);
const chat=$("chat"),input=$("input"),sendBtn=$("sendBtn"),voiceBtn=$("voiceBtn"),status=$("status"),toast=$("toast"),menu=$("menu"),menuBg=$("menuBg");
let busy=false,controller=null,imageMode=false,lastReply="";
let history=loadJSON(HISTORY_KEY,[]);
let sessions=loadJSON(SESSIONS_KEY,[{id:Date.now(),title:"Nova conversa",messages:[]}]);

function loadJSON(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch{return fallback}}
function saveHistory(){
  localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(-30)));
}
function showToast(text){toast.textContent=text;toast.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove("show"),2500)}
function resizeInput(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,130)+"px"}
function scrollBottom(){requestAnimationFrame(()=>chat.scrollTo({top:chat.scrollHeight,behavior:"smooth"}))}

// Tema Claro/Escuro
function setTheme(theme){
  document.body.setAttribute("data-theme", theme);
  localStorage.setItem(THEME_KEY, theme);
  $("themeToggleBtn").textContent = theme === "dark" ? "☀️" : "🌙";
}
function toggleTheme(){
  const current = document.body.getAttribute("data-theme");
  setTheme(current === "dark" ? "light" : "dark");
}
const savedTheme = localStorage.getItem(THEME_KEY) || "dark";
setTheme(savedTheme);

// Formatador de texto com blocos de código copiáveis
function formatMessageContent(text, bubbleElement){
  bubbleElement.innerHTML = "";
  const parts = text.split(/(```[\s\S]*?```)/g);
  
  parts.forEach(part => {
    if(part.startsWith("```") && part.endsWith("```")){
      const lines = part.slice(3, -3).trim().split("\n");
      let lang = "código";
      let codeContent = part.slice(3, -3);
      if(lines[0].trim() && !lines[0].includes(" ")){
        lang = lines[0].trim();
        codeContent = lines.slice(1).join("\n");
      }
      
      const wrapper = document.createElement("div");
      wrapper.className = "code-block-wrapper";
      
      const header = document.createElement("div");
      header.className = "code-header";
      header.innerHTML = `<span>${lang}</span>`;
      
      const copyBtn = document.createElement("button");
      copyBtn.className = "copy-code-btn";
      copyBtn.textContent = "Copiar";
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(codeContent);
        showToast("Código copiado para a área de transferência!");
      };
      
      header.appendChild(copyBtn);
      
      const pre = document.createElement("pre");
      pre.textContent = codeContent;
      
      wrapper.append(header, pre);
      bubbleElement.appendChild(wrapper);
    } else {
      const span = document.createElement("span");
      span.style.whiteSpace = "pre-wrap";
      span.textContent = part;
      bubbleElement.appendChild(span);
    }
  });
}

function addMessage(text,type="ai"){
 const row=document.createElement("div");row.className="message-row "+type;
 const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=type==="user"?"J":"A";
 const bubble=document.createElement("div");bubble.className="bubble";
 
 if(type === "ai"){
   formatMessageContent(text, bubble);
 } else {
   bubble.textContent = text;
 }
 
 row.append(avatar,bubble);chat.appendChild(row);scrollBottom();return{row,bubble};
}

function addThinking(){
 const row=document.createElement("div");row.className="message-row ai";
 const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent="A";
 const bubble=document.createElement("div");bubble.className="bubble";
 const thinking=document.createElement("div");thinking.className="thinking";
 for(let i=0;i<3;i++)thinking.appendChild(document.createElement("span"));
 bubble.appendChild(thinking);row.append(avatar,bubble);chat.appendChild(row);scrollBottom();return row;
}

async function checkBackend(){
 try{
  const r=await fetch(API+"/health",{cache:"no-store"});
  const d=await r.json();
  if(!r.ok)throw new Error("HTTP "+r.status);
  status.textContent="● ONLINE";status.style.color="var(--green)";
  return d;
 }catch(e){status.textContent="● OFFLINE";status.style.color="var(--danger)";console.error(e);return null}
}

async function chatWithAI(message){
 controller=new AbortController();
 const r=await fetch(API+"/chat",{
  method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({message,conversationId:"adaptra-main",history:history.slice(-10)}),
  signal:controller.signal
 });
 const raw=await r.text();let d;
 try{d=raw?JSON.parse(raw):{}}catch{throw new Error("O backend não retornou JSON.")}
 if(!r.ok)throw new Error(d?.error||"Erro HTTP "+r.status);
 const reply=String(d.reply||d.response||d.message||"").replace(/<think>[\s\S]*?<\/think>/gi,"").trim();
 if(!reply)throw new Error("A IA não enviou uma resposta.");
 return reply;
}

async function generateImage(prompt){
 const controllerLocal=new AbortController();
 const timeout=setTimeout(()=>controllerLocal.abort(),120000);
 try{
  const r=await fetch(API+"/generate",{
   method:"POST",
   headers:{"Content-Type":"application/json","Accept":"application/json"},
   body:JSON.stringify({prompt:String(prompt||"").trim()}),
   signal:controllerLocal.signal
  });

  const type=(r.headers.get("content-type")||"").toLowerCase();
  const raw=await r.text();
  let d=null;
  try{d=raw?JSON.parse(raw):null}catch{}

  if(!r.ok){
   const detail=d?.details;
   const detailText=Array.isArray(detail)?detail.map(x=>x?.message||x?.code||String(x)).join(" | "):detail;
   throw new Error(d?.error||detailText||raw.slice(0,500)||("Erro HTTP "+r.status));
  }

  if(type.includes("application/json") || d){
   if(!d?.success) throw new Error(d?.error||d?.details||"A geração de imagem falhou.");
   if(typeof d.image==="string" && d.image.startsWith("data:image/")) return d.image;
   if(typeof d.image==="string") return "data:image/jpeg;base64,"+d.image;
   throw new Error("O backend respondeu, mas não enviou a imagem.");
  }

  if(type.includes("image/")){
   const blob=new Blob([raw],{type:type.split(";")[0]});
   return URL.createObjectURL(blob);
  }

  throw new Error("O servidor não retornou uma imagem válida.");
 }catch(e){
  if(e.name==="AbortError") throw new Error("A geração demorou mais de 2 minutos e foi cancelada.");
  if(e instanceof TypeError && /fetch/i.test(e.message)){
   throw new Error("Não foi possível conectar ao backend. Verifique sua internet e se o Render está online.");
  }
  throw e;
 }finally{
  clearTimeout(timeout);
 }
}

async function sendMessage(text){
 text=String(text||"").trim();
 if(!text)return;
 if(busy){if(controller)controller.abort();return}
 busy=true;sendBtn.classList.add("stop");sendBtn.textContent="■";
 input.value="";resizeInput();
 $("welcome")?.remove();
 addMessage(text,"user");
 const thinking=addThinking();
 try{
  if(imageMode){
   const url=await generateImage(text);
   thinking.remove();
   const m=addMessage("Imagem criada:","ai");
   const img=document.createElement("img");img.className="generated-image";img.src=url;img.alt=text;
   m.bubble.appendChild(img);
  }else{
   const reply=await chatWithAI(text);
   thinking.remove();addMessage(reply,"ai");
   history.push({role:"user",content:text},{role:"assistant",content:reply});saveHistory();
   lastReply=reply;
  }
 }catch(e){
  thinking.remove();
  if(e.name==="AbortError"){addMessage("Geração cancelada.","ai")}else{console.error(e);addMessage("❌ "+e.message,"ai");showToast(e.message)}
 }finally{
  busy=false;controller=null;sendBtn.classList.remove("stop");sendBtn.textContent="➤";scrollBottom();
 }
}

function newChat(){
 history=[];localStorage.removeItem(HISTORY_KEY);
 chat.innerHTML=`<section class="welcome" id="welcome"><div class="welcome-top"><div class="welcome-icon">✨</div><div><h1>Nova conversa 👋</h1></div></div><p>Como posso ajudar você hoje?</p></section>`;
 closeMenu();
 showToast("Nova conversa criada.");
}

function renderHistoryList(){
  const list = $("historyList");
  list.innerHTML = `<button class="menu-item" onclick="newChat()">💬 Nova conversa</button>`;
}

function closeMenu(){menu.classList.remove("open");menuBg.classList.remove("open")}
function openMenu(){renderHistoryList();menu.classList.add("open");menuBg.classList.add("open")}

input.addEventListener("input",resizeInput);
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage(input.value)}});
sendBtn.addEventListener("click",()=>sendMessage(input.value));

document.querySelectorAll(".quick").forEach(b=>b.addEventListener("click",()=>sendMessage(b.dataset.msg)));

$("newChat").addEventListener("click",newChat);
$("menuNew").addEventListener("click",newChat);
$("menuBtn").addEventListener("click",openMenu);
$("closeMenu").addEventListener("click",closeMenu);
menuBg.addEventListener("click",closeMenu);

$("themeToggleBtn").addEventListener("click",toggleTheme);
$("menuTheme").addEventListener("click",() => { toggleTheme(); closeMenu(); });

$("imageMode").addEventListener("click",()=>{
 imageMode=!imageMode;
 $("imageMode").classList.toggle("active",imageMode);
 $("chatMode").classList.toggle("active",!imageMode);
 input.placeholder=imageMode?"Descreva a imagem que deseja criar...":"Converse com a Adaptra...";
 showToast(imageMode?"Modo imagem ativado":"Modo Adaptra ativado");
});

$("chatMode").addEventListener("click",()=>{imageMode=false;$("imageMode").classList.remove("active");$("chatMode").classList.add("active");input.placeholder="Converse com a Adaptra..."});
$("attachBtn").addEventListener("click",()=>showToast("Anexos serão adicionados em uma próxima versão."));
$("memoryBtn").addEventListener("click",()=>showToast("Memória disponível no backend."));
$("teachBtn").addEventListener("click",()=>showToast("Modo ensinar conectado ao sistema."));
$("webBtn").addEventListener("click",()=>showToast("Busca web integrada."));
$("speakBtn").addEventListener("click",()=>{
 if(!lastReply)return showToast("Ainda não existe uma resposta para falar.");
 if("speechSynthesis" in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(lastReply))}
});
$("voiceBtn").addEventListener("click",()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return showToast("Seu navegador não suporta reconhecimento de voz.");
 const rec=new SR();rec.lang="pt-BR";rec.interimResults=false;
 rec.onresult=e=>{input.value=e.results[0][0].transcript;resizeInput()};
 rec.onerror=()=>showToast("Não foi possível usar o microfone.");
 rec.start();
});
$("menuStatus").addEventListener("click",async()=>{closeMenu();showToast((await checkBackend())?"Backend online":"Backend offline")});
$("menuCreator").addEventListener("click",()=>{closeMenu();showToast("Adaptra.AI — projeto desenvolvido por Jheymison.")});
$("menuMemory").addEventListener("click",()=>{closeMenu();showToast("Sistema de memória ativo.")});

checkBackend();
resizeInput();
</script>
</body>
</html>
