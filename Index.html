<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="color-scheme" content="dark">

<title>Adaptra.AI 3.6</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#060914;
  --panel:#0c1220;
  --panel2:#111a2b;
  --border:#23314a;
  --text:#f5f7ff;
  --muted:#8996aa;
  --blue:#536dff;
  --purple:#8b5cf6;
  --green:#35d58a;
  --danger:#ff5571;
  --composer:0px;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

button,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100dvh;
  max-width:1000px;
  margin:auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;

  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(83,109,255,.18),
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 18%,
      rgba(139,92,246,.13),
      transparent 30%
    ),
    var(--bg);
}

/* HEADER */

.header{
  height:68px;
  flex:0 0 68px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    max(9px,env(safe-area-inset-top))
    14px
    8px;

  background:rgba(6,9,20,.84);
  border-bottom:1px solid rgba(255,255,255,.06);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.logo{
  width:42px;
  height:42px;
  flex:0 0 42px;

  display:grid;
  place-items:center;

  border-radius:14px;

  font-size:20px;
  font-weight:950;

  color:white;

  background:
    linear-gradient(
      135deg,
      #536dff,
      #8b5cf6
    );

  box-shadow:
    0 8px 28px rgba(83,109,255,.28);
}

.brand-info{
  min-width:0;
}

.brand-name{
  font-size:16px;
  font-weight:850;
  white-space:nowrap;
}

.brand-name b{
  color:#8092ff;
}

.version{
  color:#66748c;
  font-size:9px;
  margin-left:3px;
}

.status{
  margin-top:2px;
  color:var(--green);
  font-size:10px;
  font-weight:700;
}

.header-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:40px;
  height:40px;

  border:1px solid var(--border);
  border-radius:13px;

  background:rgba(17,26,43,.8);
  color:#e8edfa;

  display:grid;
  place-items:center;

  font-size:17px;
}

.icon-btn:active{
  transform:scale(.94);
}

/* CHAT */

.chat{
  flex:1;
  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  padding:
    18px
    12px
    185px;

  scroll-behavior:smooth;
  overscroll-behavior:contain;
}

.chat::-webkit-scrollbar{
  width:4px;
}

.chat::-webkit-scrollbar-thumb{
  background:#26344c;
  border-radius:20px;
}

/* WELCOME */

.welcome{
  max-width:720px;
  margin:12px auto 24px;

  padding:22px;

  border-radius:25px;

  border:1px solid rgba(110,130,255,.18);

  background:
    linear-gradient(
      145deg,
      rgba(20,30,52,.94),
      rgba(9,14,26,.96)
    );

  box-shadow:
    0 25px 70px rgba(0,0,0,.25);
}

.welcome-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.welcome-icon{
  width:46px;
  height:46px;

  display:grid;
  place-items:center;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      rgba(83,109,255,.22),
      rgba(139,92,246,.2)
    );

  border:1px solid rgba(120,140,255,.18);
}

.welcome h1{
  margin:0;
  font-size:24px;
  line-height:1.2;
}

.welcome h1 span{
  color:#8190ff;
}

.welcome p{
  color:var(--muted);
  line-height:1.55;
  font-size:14px;
  margin:12px 0 0;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:18px;
}

.quick{
  padding:13px;

  border:1px solid #23314a;
  border-radius:16px;

  text-align:left;

  background:
    rgba(14,23,39,.8);

  color:#dce4f3;

  transition:.15s;
}

.quick:hover{
  border-color:#536dff;
  transform:translateY(-1px);
}

.quick:active{
  transform:scale(.98);
}

.quick strong{
  display:block;
  margin-top:4px;
}

.quick small{
  display:block;
  margin-top:3px;
  color:var(--muted);
}

/* MESSAGES */

.message-row{
  display:flex;
  gap:8px;

  width:100%;

  margin:13px 0;

  animation:
    messageIn .18s ease-out;
}

.message-row.user{
  justify-content:flex-end;
}

.avatar{
  width:35px;
  height:35px;
  min-width:35px;

  display:grid;
  place-items:center;

  border-radius:12px;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      #536dff,
      #8b5cf6
    );

  box-shadow:
    0 7px 22px rgba(83,109,255,.18);
}

.user .avatar{
  order:2;
}

.bubble{
  max-width:min(82%,700px);

  padding:12px 14px;

  border-radius:18px;

  border:1px solid rgba(255,255,255,.06);

  background:
    linear-gradient(
      145deg,
      #121d30,
      #0e1727
    );

  color:#f0f4ff;

  line-height:1.55;
  font-size:15px;

  white-space:pre-wrap;
  overflow-wrap:anywhere;

  box-shadow:
    0 8px 25px rgba(0,0,0,.12);
}

.ai .bubble{
  border-top-left-radius:7px;
}

.user .bubble{
  border-top-right-radius:7px;

  background:
    linear-gradient(
      135deg,
      #4b68ed,
      #7459e9
    );
}

/* THINKING */

.thinking{
  display:flex;
  align-items:center;
  gap:4px;

  width:max-content;
  padding:4px 2px;
}

.thinking span{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#8292ff;

  animation:
    thinking 1.15s infinite ease-in-out;
}

.thinking span:nth-child(2){
  animation-delay:.15s;
}

.thinking span:nth-child(3){
  animation-delay:.30s;
}

@keyframes thinking{

  0%,70%,100%{
    opacity:.25;
    transform:translateY(0);
  }

  35%{
    opacity:1;
    transform:translateY(-4px);
  }
}

@keyframes messageIn{

  from{
    opacity:0;
    transform:translateY(6px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* IMAGE */

.generated-image{
  display:block;

  width:100%;
  max-width:520px;

  margin-top:9px;

  border-radius:17px;

  border:1px solid rgba(255,255,255,.1);

  box-shadow:
    0 18px 55px rgba(0,0,0,.4);
}

/* COMPOSER */

.composer-wrap{
  position:fixed;

  left:0;
  right:0;
  bottom:var(--composer);

  z-index:50;

  pointer-events:none;
}

.composer{
  width:min(1000px,100%);
  margin:auto;

  padding:
    8px
    10px
    max(9px,env(safe-area-inset-bottom));

  background:
    linear-gradient(
      to top,
      rgba(6,9,20,.99),
      rgba(6,9,20,.9),
      transparent
    );

  pointer-events:auto;
}

.composer-box{
  display:flex;
  align-items:flex-end;
  gap:6px;

  padding:7px;

  border-radius:22px;

  border:1px solid #293852;

  background:
    rgba(12,18,32,.97);

  box-shadow:
    0 15px 50px rgba(0,0,0,.4);
}

.attach-btn,
.voice-btn,
.send-btn{
  width:43px;
  height:43px;
  min-width:43px;

  border-radius:15px;

  border:1px solid #27364e;

  display:grid;
  place-items:center;

  color:#eaf0ff;
}

.attach-btn,
.voice-btn{
  background:#142036;
}

.send-btn{
  border:0;

  background:
    linear-gradient(
      135deg,
      #536dff,
      #8b5cf6
    );

  font-size:18px;

  box-shadow:
    0 8px 25px rgba(83,109,255,.22);
}

.send-btn.stop{
  background:var(--danger);
}

textarea{
  flex:1;
  min-width:0;

  min-height:43px;
  max-height:130px;

  padding:11px 5px;

  border:0;
  outline:0;
  resize:none;

  background:transparent;

  color:white;

  font-size:15px;
  line-height:21px;

  overflow-y:auto;
}

textarea::placeholder{
  color:#718096;
}

.tools{
  display:flex;
  gap:6px;

  margin-top:7px;

  overflow-x:auto;

  scrollbar-width:none;
}

.tools::-webkit-scrollbar{
  display:none;
}

.tool{
  flex:0 0 auto;

  padding:7px 10px;

  border-radius:12px;

  border:1px solid #202d43;

  background:#0f192b;

  color:#99a6bb;

  font-size:11px;

  transition:.15s;
}

.tool.active{
  color:#e4eaff;

  border-color:#536dff;

  background:#18264b;

  box-shadow:
    0 5px 20px rgba(83,109,255,.12);
}

/* TOAST */

.toast{
  position:fixed;

  left:50%;

  bottom:110px;

  transform:
    translate(-50%,15px);

  max-width:90%;

  padding:10px 14px;

  border-radius:13px;

  border:1px solid #2b3a54;

  background:#111b2c;

  color:#e3e9f6;

  font-size:12px;

  opacity:0;

  pointer-events:none;

  transition:.2s;

  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* MENU */

.menu-bg{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.55);

  display:none;

  z-index:70;
}

.menu-bg.open{
  display:block;
}

.menu{
  position:fixed;

  left:0;
  top:0;
  bottom:0;

  width:min(320px,88vw);

  padding:
    max(18px,env(safe-area-inset-top))
    16px;

  background:
    linear-gradient(
      160deg,
      #0d1627,
      #080e1a
    );

  border-right:1px solid #22304a;

  transform:translateX(-105%);

  transition:.25s;

  z-index:80;

  box-shadow:
    15px 0 60px rgba(0,0,0,.35);
}

.menu.open{
  transform:translateX(0);
}

.menu-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:20px;
}

.menu-title{
  font-size:20px;
  font-weight:900;
}

.menu-item{
  width:100%;

  display:flex;
  align-items:center;
  gap:10px;

  padding:13px;

  margin:5px 0;

  border:0;

  border-radius:13px;

  background:transparent;

  color:#dce4f4;

  text-align:left;
}

.menu-item:hover{
  background:#142037;
}

/* MOBILE */

@media(max-width:600px){

  .header{
    height:64px;
    flex-basis:64px;
    padding-left:10px;
    padding-right:10px;
  }

  .logo{
    width:38px;
    height:38px;
    min-width:38px;
  }

  .brand-name{
    font-size:15px;
  }

  .chat{
    padding:
      14px
      9px
      185px;
  }

  .welcome{
    padding:18px;
    border-radius:22px;
  }

  .welcome h1{
    font-size:22px;
  }

  .bubble{
    max-width:88%;
  }

  .composer{
    padding-left:7px;
    padding-right:7px;
  }
}

@media(max-width:390px){

  .quick-grid{
    grid-template-columns:1fr;
  }

  .bubble{
    max-width:91%;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="brand">

    <div class="logo">A</div>

    <div class="brand-info">

      <div class="brand-name">
        Adaptra<b>.AI</b>
        <span class="version">3.6</span>
      </div>

      <div class="status" id="status">
        ● conectando
      </div>

    </div>

  </div>

  <div class="header-actions">

    <button
      class="icon-btn"
      id="newChat">
      ＋
    </button>

    <button
      class="icon-btn"
      id="menuBtn">
      ☰
    </button>

  </div>

</header>


<main class="chat" id="chat">

<section class="welcome" id="welcome">

  <div class="welcome-top">

    <div class="welcome-icon">
      ✨
    </div>

    <div>

      <h1>
        Olá, <span>Jheymison</span> 👋
      </h1>

    </div>

  </div>

  <p>
    Eu sou a Adaptra.AI 3.6.
    Posso conversar, ajudar com programação,
    projetos, ideias e criação de imagens.
  </p>

  <div class="quick-grid">

    <button
      class="quick"
      data-msg="Quero criar um projeto novo.">
      🚀
      <strong>Criar projeto</strong>
      <small>Começar uma ideia</small>
    </button>

    <button
      class="quick"
      data-msg="Me ajude a criar um jogo 2D.">
      🎮
      <strong>Criar jogo</strong>
      <small>Desenvolvimento</small>
    </button>

    <button
      class="quick"
      data-msg="Explique programação de forma simples.">
      💻
      <strong>Programar</strong>
      <small>Ajuda com código</small>
    </button>

    <button
      class="quick"
      data-msg="Me dê ideias para um projeto.">
      💡
      <strong>Ideias</strong>
      <small>Brainstorm</small>
    </button>

  </div>

</section>

</main>


<div
  class="composer-wrap"
  id="composerWrap">

  <div class="composer">

    <div class="composer-box">

      <button
        class="attach-btn"
        id="attachBtn">
        ＋
      </button>

      <textarea
        id="input"
        rows="1"
        placeholder="Converse com a Adaptra..."
        autocomplete="off"
        spellcheck="true"></textarea>

      <button
        class="voice-btn"
        id="voiceBtn">
        🎤
      </button>

      <button
        class="send-btn"
        id="sendBtn">
        ➤
      </button>

    </div>


    <div class="tools">

      <button
        class="tool active"
        id="chatMode">
        🧠 Adaptra
      </button>

      <button
        class="tool"
        id="imageMode">
        🎨 Imagem
      </button>

      <button
        class="tool"
        id="memoryBtn">
        💾 Memória
      </button>

      <button
        class="tool"
        id="teachBtn">
        🧠 Ensinar
      </button>

      <button
        class="tool"
        id="webBtn">
        🌐 Web
      </button>

      <button
        class="tool"
        id="speakBtn">
        🔊 Falar
      </button>

    </div>

  </div>

</div>


<div
  class="menu-bg"
  id="menuBg"></div>

<aside
  class="menu"
  id="menu">

  <div class="menu-header">

    <div class="menu-title">
      🤖 Adaptra.AI
    </div>

    <button
      class="icon-btn"
      id="closeMenu">
      ×
    </button>

  </div>

  <button
    class="menu-item"
    id="menuNew">
    💬 Nova conversa
  </button>

  <button
    class="menu-item"
    id="menuMemory">
    🧠 Memória
  </button>

  <button
    class="menu-item"
    id="menuCreator">
    👤 Sobre o criador
  </button>

  <button
    class="menu-item"
    id="menuStatus">
    🟢 Testar backend
  </button>

</aside>


<div
  class="toast"
  id="toast"></div>

</div>


<script>
"use strict";

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const API =
  "https://adaptra-backend.onrender.com";

const HISTORY_KEY =
  "adaptra36_history";

const MEMORY_KEY =
  "adaptra36_memory";


/* =========================================================
   ELEMENTOS
========================================================= */

const $ =
  id => document.getElementById(id);

const chat =
  $("chat");

const input =
  $("input");

const sendBtn =
  $("sendBtn");

const voiceBtn =
  $("voiceBtn");

const status =
  $("status");

const toast =
  $("toast");

const menu =
  $("menu");

const menuBg =
  $("menuBg");


/* =========================================================
   ESTADO
========================================================= */

let busy =
  false;

let controller =
  null;

let imageMode =
  false;

let lastReply =
  "";


let history =
  loadJSON(
    HISTORY_KEY,
    []
  );

let memories =
  loadJSON(
    MEMORY_KEY,
    {}
  );


/* =========================================================
   JSON
========================================================= */

function loadJSON(
  key,
  fallback
){

  try{

    const value =
      localStorage.getItem(key);

    return value
      ? JSON.parse(value)
      : fallback;

  }catch{

    return fallback;

  }

}


/* =========================================================
   UI
========================================================= */

function showToast(text){

  toast.textContent =
    text;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(
      () =>
        toast.classList.remove(
          "show"
        ),
      2500
    );

}


function resizeInput(){

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      130
    ) + "px";

}


function scrollBottom(){

  requestAnimationFrame(
    () => {

      chat.scrollTo({
        top:
          chat.scrollHeight,
        behavior:
          "smooth"
      });

    }
  );

}


/* =========================================================
   MENSAGEM
========================================================= */

function addMessage(
  text,
  type="ai"
){

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row " +
    type;


  const avatar =
    document.createElement(
      "div"
    );

  avatar.className =
    "avatar";

  avatar.textContent =
    type === "user"
      ? "J"
      : "A";


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  bubble.textContent =
    text;


  row.appendChild(
    avatar
  );

  row.appendChild(
    bubble
  );

  chat.appendChild(
    row
  );

  scrollBottom();

  return {
    row,
    bubble
  };

}


/* =========================================================
   ANIMAÇÃO DE PENSAMENTO
========================================================= */

function addThinking(){

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row ai";


  const avatar =
    document.createElement(
      "div"
    );

  avatar.className =
    "avatar";

  avatar.textContent =
    "A";


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  const thinking =
    document.createElement(
      "div"
    );

  thinking.className =
    "thinking";


  for(
    let i=0;
    i<3;
    i++
  ){

    thinking.appendChild(
      document.createElement(
        "span"
      )
    );

  }


  bubble.appendChild(
    thinking
  );

  row.appendChild(
    avatar
  );

  row.appendChild(
    bubble
  );

  chat.appendChild(
    row
  );

  scrollBottom();

  return row;

}


/* =========================================================
   BACKEND
========================================================= */

async function checkBackend(){

  try{

    const response =
      await fetch(
        API + "/health",
        {
          method:"GET",
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const data =
      await response.json();


    status.textContent =
      "● ONLINE";

    status.style.color =
      "var(--green)";


    console.log(
      "Adaptra backend:",
      data
    );

    return true;

  }catch(error){

    console.error(
      "Backend:",
      error
    );

    status.textContent =
      "● OFFLINE";

    status.style.color =
      "var(--danger)";

    return false;

  }

}


/* =========================================================
   CHAT — HUGGING FACE
========================================================= */

async function chatWithAI(
  message
){

  controller =
    new AbortController();


  const response =
    await fetch(
      API + "/chat",
      {

        method:
          "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            message,

            conversationId:
              "adaptra-main",

            history:
              history.slice(-10)

          }),

        signal:
          controller.signal

      }
    );


  const raw =
    await response.text();


  let data;

  try{

    data =
      raw
        ? JSON.parse(raw)
        : {};

  }catch{

    throw new Error(
      "O backend não retornou JSON."
    );

  }


  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.details ||
      "Erro HTTP " +
      response.status
    );

  }


  if(
    data.success === false
  ){

    throw new Error(
      data.error ||
      "A Adaptra não conseguiu responder."
    );

  }


  const reply =
    String(
      data.reply ||
      data.response ||
      data.message ||
      ""
    )
    .replace(
      /<think>[\s\S]*?<\/think>/gi,
      ""
    )
    .trim();


  if(!reply){

    throw new Error(
      "A IA não enviou uma resposta."
    );

  }


  return reply;

}


/* =========================================================
   IMAGEM — HUGGING FACE
========================================================= */

async function generateImage(
  prompt
){

  controller =
    new AbortController();


  const response =
    await fetch(
      API + "/generate",
      {

        method:
          "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            prompt
          }),

        signal:
          controller.signal

      }
    );


  const contentType =
    (
      response.headers.get(
        "content-type"
      ) || ""
    ).toLowerCase();


  if(!response.ok){

    const raw =
      await response.text();

    let message =
      "Erro ao gerar imagem.";


    try{

      const data =
        JSON.parse(raw);

      message =
        data.error ||
        data.details ||
        data.message ||
        message;

    }catch{

      if(raw){

        message =
          raw.slice(
            0,
            400
          );

      }

    }


    throw new Error(
      message
    );

  }


  if(
    contentType.includes(
      "image/"
    )
  ){

    return {
      type:
        "blob",

      blob:
        await response.blob()
    };

  }


  const raw =
    await response.text();


  let data;

  try{

    data =
      JSON.parse(raw);

  }catch{

    throw new Error(
      "O servidor não retornou uma imagem válida."
    );

  }


  const url =
    data.url ||
    data.imageUrl ||
    data.image ||
    data.image_url;


  if(url){

    return {
      type:
        "url",

      url:
        String(url)
    };

  }


  const base64 =
    data.b64_json ||
    data.base64;


  if(base64){

    return {
      type:
        "url",

      url:
        "data:image/png;base64," +
        base64
    };

  }


  throw new Error(
    data.error ||
    data.details ||
    "Nenhuma imagem foi retornada."
  );

}


/* =========================================================
   TYPING
========================================================= */

async function typeResponse(
  element,
  text
){

  element.textContent =
    "";


  for(
    let i=0;
    i<text.length;
    i++
  ){

    if(!busy){

      element.textContent =
        text;

      break;

    }


    element.textContent +=
      text[i];


    if(
      i % 4 === 0
    ){

      chat.scrollTop =
        chat.scrollHeight;

    }


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          8
        )
    );

  }


  element.textContent =
    text;

  scrollBottom();

}


/* =========================================================
   ENVIAR
========================================================= */

async function sendMessage(){

  const text =
    input.value.trim();


  if(
    !text ||
    busy
  ){

    return;

  }


  busy =
    true;


  input.value =
    "";

  resizeInput();


  sendBtn.textContent =
    "■";

  sendBtn.classList.add(
    "stop"
  );


  addMessage(
    text,
    "user"
  );


  const thinking =
    addThinking();


  try{

    if(imageMode){

      const result =
        await generateImage(
          text
        );


      thinking.remove();


      const message =
        addMessage(
          "🎨 Imagem criada:",
          "ai"
        );


      const img =
        document.createElement(
          "img"
        );

      img.className =
        "generated-image";

      img.alt =
        text;


      if(
        result.type ===
        "blob"
      ){

        img.src =
          URL.createObjectURL(
            result.blob
          );

      }else{

        img.src =
          result.url;

      }


      message.bubble.appendChild(
        img
      );


      scrollBottom();

      return;

    }


    const answer =
      await chatWithAI(
        text
      );


    thinking.remove();


    const result =
      addMessage(
        "",
        "ai"
      );


    lastReply =
      answer;


    history.push(
      {
        role:
          "user",

        content:
          text
      },

      {
        role:
          "assistant",

        content:
          answer
      }
    );


    history =
      history.slice(-20);


    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(
        history
      )
    );


    await typeResponse(
      result.bubble,
      answer
    );


  }catch(error){

    thinking.remove();


    if(
      error.name ===
      "AbortError"
    ){

      addMessage(
        "⏹️ Resposta interrompida.",
        "ai"
      );

    }else{

      console.error(
        error
      );

      addMessage(
        "❌ " +
        error.message,
        "ai"
      );

      showToast(
        error.message
      );

    }

  }finally{

    busy =
      false;

    controller =
      null;


    sendBtn.textContent =
      "➤";

    sendBtn.classList.remove(
      "stop"
    );


    await checkBackend();

    input.focus();

  }

}

========================================================= */

function stopResponse(){

  if(
    controller &&
    busy
  ){

    controller.abort();

  }

}


sendBtn.addEventListener(
  "click",
  () => {

    if(busy){

      stopResponse();

    }else{

      sendMessage();

    }

  }
);

   ENTER
========================================================= */

input.addEventListener(

);

========================================================= */

function setImageMode(
  enabled
){

  imageMode =
    enabled;


  $("chatMode")
    .classList.toggle(
      "active",
      !enabled
    );


  $("imageMode")
    .classList.toggle(
      "active",
      enabled
    );


  input.placeholder =
    enabled
      ? "Descreva a imagem que quer criar..."
      : "Converse com a Adaptra...";


  showToast(
    enabled
      ? "🎨 Modo imagem ativado."
      : "🧠 Modo Adaptra ativado."
  );

}


$("chatMode").onclick =
  () => setImageMode(false);

$("imageMode").onclick =
  () => setImageMode(true);


/* =========================================================
   VOZ
========================================================= */

voiceBtn.onclick =
  () => {

    const Recognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if(!Recognition){

      showToast(
        "🎤 Reconhecimento de voz não disponível."
      );

      return;

    }


    const recognition =
      new Recognition();


    recognition.lang =
      "pt-BR";

    recognition.interimResults =
      false;

    recognition.maxAlternatives =
      1;


    voiceBtn.textContent =
      "🔴";


    recognition.onresult =
      event => {

        input.value =
          event
            .results[0][0]
            .transcript;

        resizeInput();

      };


    recognition.onerror =
      () => {

        showToast(
          "Não consegui ouvir você."
        );

      };


    recognition.onend =
      () => {

        voiceBtn.textContent =
          "🎤";

      };


    try{

      recognition.start();

    }catch{

      voiceBtn.textContent =
        "🎤";

    }

  };


/* =========================================================
   FALAR
========================================================= */

$("speakBtn").onclick =
  () => {

    if(!lastReply){

      showToast(
        "Ainda não existe uma resposta."
      );

      return;

    }


    if(
      !("speechSynthesis"
        in window)
    ){

      showToast(
        "Voz não disponível."
      );

      return;

    }


    speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        lastReply
      );


    utterance.lang =
      "pt-BR";

    utterance.rate =
      .92;


    speechSynthesis.speak(
      utterance
    );

  };

/* =========================================================
   HISTÓRICO
========================================================= */

function renderHistory(){

  if(
    !Array.isArray(history) ||
    !history.length
  ){

    return;

  }


  const welcome =
    $("welcome");


  if(welcome){

    welcome.style.display =
      "none";

  }


  history.forEach(
    item => {

      if(
        !item ||
        !item.content
      ){

        return;

      }


      addMessage(
        String(
          item.content
        ),

        item.role === "user"
          ? "user"
          : "ai"
      );

    }
  );

}


/* =========================================================
   TECLADO MOBILE
========================================================= */

function updateKeyboard(){

  if(
    !window.visualViewport
  ){

    return;

  }


  const viewport =
    window.visualViewport;


  const keyboard =
    Math.max(
      0,

      window.innerHeight -
      viewport.height -
      viewport.offsetTop
    );


  document.documentElement
    .style
    .setProperty(
      "--composer",
      keyboard + "px"
    );


  setTimeout(
    () => {

      chat.scrollTop =
        chat.scrollHeight;

    },
    50
  );

}


if(
  window.visualViewport
){

  window.visualViewport.addEventListener(
    "resize",
    updateKeyboard
  );

  window.visualViewport.addEventListener(
    "scroll",
    updateKeyboard
  );

}


window.addEventListener(
  "resize",
  updateKeyboard
);


input.addEventListener(
  "focus",
  () => {

    setTimeout(
      updateKeyboard,
      100
    );

  }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

(async function(){

  renderHistory();

  resizeInput();

  updateKeyboard();


  const online =
    await checkBackend();


  addMessage(
    online
      ? "🟢 Adaptra 3.6 conectada ao backend Hugging Face."
      : "🔴 Não consegui conectar ao backend.",
    "ai"
  );

})();
