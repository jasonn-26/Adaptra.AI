<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#070b14">
<title>Adaptra.AI 4.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} :root{--bg:#060914;--p:#0c1424;--p2:#111c30;--b:#263650;--t:#f5f7ff;--m:#8996aa;--blue:#5b73ff;--pur:#9a6cff;--green:#35d58a;--red:#ff5571}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;max-width:1100px;margin:auto;display:flex;flex-direction:column;background:radial-gradient(circle at 10% 0%,#5b73ff2b,transparent 30%),radial-gradient(circle at 95% 20%,#9a6cff20,transparent 30%),var(--bg)}
.header{height:68px;flex:0 0 68px;display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:#060914d9;border-bottom:1px solid #ffffff0d;backdrop-filter:blur(20px);z-index:10}.brand{display:flex;align-items:center;gap:10px}.logo,.auth-logo{display:grid;place-items:center;font-weight:950;background:linear-gradient(135deg,var(--blue),var(--pur));box-shadow:0 8px 30px #536dff40}.logo{width:43px;height:43px;border-radius:14px;font-size:21px}.brand-name{font-weight:850}.brand-name b{color:#8292ff}.version{font-size:9px;color:#68768d;margin-left:4px}.status{font-size:10px;color:var(--m);margin-top:2px;font-weight:750}.status.online{color:var(--green)}.actions{display:flex;gap:7px;align-items:center}.icon{width:40px;height:40px;border:1px solid var(--b);border-radius:13px;background:#111a2bd0;color:white}.mini{display:none;width:32px;height:32px;border-radius:50%;place-items:center;background:linear-gradient(135deg,var(--blue),var(--pur));font-size:12px;font-weight:900}.mini.show{display:grid}.login-top{display:none;padding:9px 12px;border:1px solid #33466a;border-radius:12px;background:#121d31;color:#fff;font-weight:800;font-size:12px}.login-top.show{display:block}
.chat{flex:1;min-height:0;overflow:auto;padding:18px 12px 190px}.welcome{max-width:760px;margin:12px auto 24px;padding:24px;border:1px solid #6e82ff2e;border-radius:27px;background:linear-gradient(145deg,#141e34f2,#090e1af5);box-shadow:0 25px 70px #0005}.welcome-top{display:flex;gap:12px;align-items:center}.welcome-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;background:#5b73ff22;font-size:23px}.welcome h1{margin:0;font-size:24px}.welcome h1 span{color:#8292ff}.welcome p{color:var(--m);line-height:1.55;font-size:14px}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick{padding:13px;text-align:left;border:1px solid var(--b);border-radius:16px;background:#0e1727cc;color:#dce4f3}.quick strong,.quick small{display:block}.quick small{color:var(--m);font-size:11px;margin-top:3px}.message-row{display:flex;gap:8px;margin:13px 0;animation:in .18s ease-out}.message-row.user{justify-content:flex-end}.avatar{width:35px;height:35px;min-width:35px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--pur));font-weight:900}.user .avatar{order:2}.bubble{max-width:min(84%,760px);padding:12px 14px;border-radius:18px;background:linear-gradient(145deg,#121d30,#0e1727);border:1px solid #ffffff0d;line-height:1.55;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}.ai .bubble{border-top-left-radius:7px}.user .bubble{border-top-right-radius:7px;background:linear-gradient(135deg,#4b68ed,#7459e9)}.thinking{display:flex;gap:5px}.thinking span{width:6px;height:6px;border-radius:50%;background:#8292ff;animation:dots 1.15s infinite}.thinking span:nth-child(2){animation-delay:.15s}.thinking span:nth-child(3){animation-delay:.3s}@keyframes dots{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-4px)}}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.generated{display:block;max-width:540px;width:100%;margin-top:8px;border-radius:17px;border:1px solid #ffffff19}
.composer-wrap{position:fixed;left:0;right:0;bottom:0;z-index:20}.composer{max-width:1100px;margin:auto;padding:8px 10px max(9px,env(safe-area-inset-bottom));background:linear-gradient(to top,#060914, #060914ee,transparent)}.box{display:flex;align-items:flex-end;gap:6px;padding:7px;border:1px solid #293852;border-radius:22px;background:#0c1220f7;box-shadow:0 15px 50px #0006}.btn{width:43px;height:43px;min-width:43px;border-radius:15px;border:1px solid var(--b);background:#142036;color:white}.send{border:0;background:linear-gradient(135deg,var(--blue),var(--pur))}.send.stop{background:var(--red)}textarea{flex:1;min-width:0;min-height:43px;max-height:130px;padding:11px 5px;resize:none;border:0;outline:0;background:transparent;color:white;line-height:21px}textarea::placeholder{color:#718096}.tools{display:flex;gap:6px;overflow:auto;margin-top:7px}.tool{flex:0 0 auto;padding:7px 10px;border-radius:12px;border:1px solid #202d43;background:#0f192b;color:#99a6bb;font-size:11px}.tool.active{border-color:var(--blue);background:#18264b;color:white}
.menu-bg{position:fixed;inset:0;background:#0008;display:none;z-index:40}.menu-bg.open{display:block}.menu{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);padding:max(18px,env(safe-area-inset-top)) 16px;background:linear-gradient(160deg,#0d1627,#080e1a);border-right:1px solid var(--b);transform:translateX(-105%);transition:.25s;z-index:50}.menu.open{transform:none}.menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.menu-item{width:100%;padding:13px;margin:5px 0;border:0;border-radius:13px;background:transparent;color:#dce4f4;text-align:left}.menu-item:hover{background:#142037}.profile{display:none;padding:15px;margin-bottom:10px;border:1px solid var(--b);border-radius:17px;background:#0b1525}.profile.show{display:block}.email{color:var(--m);font-size:12px;word-break:break-all;margin-top:4px}.logout{width:100%;margin-top:10px;padding:10px;border:1px solid var(--b);border-radius:12px;background:#121e31;color:white}
.auth{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:#03060ed9;backdrop-filter:blur(22px)}.auth.hide{display:none}.card{width:min(430px,100%);padding:25px;border:1px solid #273754;border-radius:28px;background:linear-gradient(145deg,#121c30fa,#080d18fa);box-shadow:0 30px 100px #0009}.auth-logo{width:58px;height:58px;border-radius:19px;font-size:27px;margin-bottom:16px}.card h2{margin:0;font-size:25px}.card p{color:var(--m);font-size:13px;line-height:1.5}.field{width:100%;margin-top:9px;padding:13px 14px;border-radius:14px;border:1px solid #293852;outline:0;background:#0a1220;color:white}.field:focus{border-color:var(--blue)}.primary{width:100%;margin-top:12px;padding:13px;border:0;border-radius:14px;color:white;font-weight:850;background:linear-gradient(135deg,var(--blue),var(--pur))}.switch{width:100%;margin-top:12px;border:0;background:transparent;color:#94a4ff}.error{min-height:18px;margin-top:8px;color:#ff8296;font-size:12px}.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,15px);padding:10px 14px;border:1px solid #2b3a54;border-radius:13px;background:#111b2c;color:#e3e9f6;font-size:12px;opacity:0;transition:.2s;z-index:120}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.header{height:64px;flex-basis:64px;padding:9px 10px}.logo{width:38px;height:38px}.chat{padding:14px 9px 185px}.welcome{padding:18px}.welcome h1{font-size:22px}.bubble{max-width:89%}}@media(max-width:390px){.quick-grid{grid-template-columns:1fr}}
</style></head>
<body><div class="app">
<header class="header"><div class="brand"><div class="logo">A</div><div><div class="brand-name">Adaptra<b>.AI</b><span class="version">4.0</span></div><div class="status" id="status">● conectando</div></div></div><div class="actions"><div class="mini" id="mini">A</div><button class="login-top" id="loginTop">Entrar</button><button class="icon" id="newChat">＋</button><button class="icon" id="menuBtn">☰</button></div></header>
<main class="chat" id="chat"><section class="welcome"><div class="welcome-top"><div class="welcome-icon">✨</div><h1>Olá, <span>Jheymison</span> 👋</h1></div><p>Adaptra.AI 4.0 — chat, programação, projetos, memória e criação de imagens.</p><div class="quick-grid"><button class="quick" data-msg="Quero criar um projeto novo.">🚀<strong>Criar projeto</strong><small>Começar uma ideia</small></button><button class="quick" data-msg="Me ajude a criar um jogo 2D.">🎮<strong>Criar jogo</strong><small>Desenvolvimento</small></button><button class="quick" data-msg="Explique programação de forma simples.">💻<strong>Programar</strong><small>Ajuda com código</small></button><button class="quick" data-msg="Me dê ideias para um projeto.">💡<strong>Ideias</strong><small>Brainstorm</small></button></div></section></main>
<div class="composer-wrap"><div class="composer"><div class="box"><button class="btn" id="attach">＋</button><textarea id="input" rows="1" placeholder="Converse com a Adaptra..."></textarea><button class="btn" id="voice">🎤</button><button class="btn send" id="send">➤</button></div><div class="tools"><button class="tool active" id="chatMode">🧠 Adaptra</button><button class="tool" id="imageMode">🎨 Imagem</button><button class="tool" id="memory">💾 Memória</button><button class="tool" id="teach">🧠 Ensinar</button><button class="tool" id="speak">🔊 Falar</button></div></div></div>
<div class="menu-bg" id="menuBg"></div><aside class="menu" id="menu"><div class="menu-head"><strong>🤖 Adaptra.AI</strong><button class="icon" id="close">×</button></div><div class="profile" id="profile"><strong>Conta conectada</strong><div class="email" id="email"></div><button class="logout" id="logout">Sair da conta</button></div><button class="menu-item" id="mnew">💬 Nova conversa</button><button class="menu-item" id="mmem">🧠 Memória</button><button class="menu-item" id="mstatus">🟢 Testar backend</button></aside>
<div class="auth" id="auth"><div class="card"><div class="auth-logo">A</div><h2 id="authTitle">Entrar na Adaptra.AI</h2><p id="authText">Entre para sincronizar sua conta, memória, conversas e projetos.</p><input class="field" id="aemail" type="email" placeholder="Seu e-mail"><input class="field" id="apass" type="password" placeholder="Sua senha"><button class="primary" id="submit">Entrar</button><button class="switch" id="switch">Ainda não tenho conta — criar</button><div class="error" id="error"></div></div></div><div class="toast" id="toast"></div></div>
<script>
"use strict";
const API="https://adaptra-backend.onrender.com";
const SUPABASE_URL="https://anxtcfatziljkdoyzuwq.supabase.co";
const SUPABASE_KEY="sb_publishable_h80aRkEYFGD1z4sFGtgTsg_vUuvUjPU";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);const chat=$('chat'),input=$('input'),send=$('send'),status=$('status'),auth=$('auth'),errorBox=$('error');
let busy=false,controller=null,image=false,signup=false,lastReply="",history=[],conversationId=null;
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px'}
function bottom(){requestAnimationFrame(()=>chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'}))}
function msg(text,type='ai'){const r=document.createElement('div');r.className='message-row '+type;const a=document.createElement('div');a.className='avatar';a.textContent=type==='user'?'J':'A';const b=document.createElement('div');b.className='bubble';b.textContent=text;r.append(a,b);chat.appendChild(r);bottom();return{r,b}}
function thinking(){const x=msg('', 'ai');x.b.innerHTML='<div class="thinking"><span></span><span></span><span></span></div>';return x.r}
async function token(){const {data}=await sb.auth.getSession();return data?.session?.access_token||null}
async function api(path,opt={}){const t=await token();if(!t){auth.classList.remove('hide');$('loginTop').classList.add('show');throw Error('Você precisa estar logado.')}return fetch(API+path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t,'Content-Type':opt.body?'application/json':(opt.headers?.['Content-Type']||undefined)}})}
async function health(){try{let r=await fetch(API+'/health',{cache:'no-store'});if(!r.ok)throw Error();status.textContent='● ONLINE';status.classList.add('online');return true}catch{status.textContent='● OFFLINE';status.classList.remove('online');return false}}
async function sendMessage(forced){if(busy)return;let text=(forced??input.value).trim();if(!text)return;input.value='';resize();msg(text,'user');let wait=thinking();busy=true;send.classList.add('stop');send.textContent='■';try{if(image){let r=await api('/generate',{method:'POST',body:JSON.stringify({prompt:text})});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.error||'Erro na imagem.')}let blob=await r.blob();wait.remove();let x=msg('','ai');let im=document.createElement('img');im.className='generated';im.src=URL.createObjectURL(blob);im.alt='Imagem gerada pela Adaptra.AI';x.b.appendChild(im);lastReply='Imagem gerada.'}else{let r=await api('/chat',{method:'POST',body:JSON.stringify({message:text,history:history.slice(-10),conversationId:conversationId||'adaptra-main'})});let d=await r.json();if(!r.ok)throw Error(d.error||'Erro no chat.');let reply=String(d.reply||'').trim();if(!reply)throw Error('A IA não retornou uma resposta.');wait.remove();msg(reply);lastReply=reply;history.push({role:'user',content:text},{role:'assistant',content:reply});history=history.slice(-40)}}catch(e){wait.remove();if(e.name!=='AbortError')msg('⚠️ '+e.message)}finally{busy=false;controller=null;send.classList.remove('stop');send.textContent='➤'}}
async function authSubmit(){errorBox.textContent='';let email=$('aemail').value.trim(),password=$('apass').value;if(!email||!password){errorBox.textContent='Informe e-mail e senha.';return}if(password.length<6){errorBox.textContent='A senha precisa ter pelo menos 6 caracteres.';return}$('submit').disabled=true;$('submit').textContent=signup?'Criando...':'Entrando...';try{let r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(signup&&!r.data.session){errorBox.textContent='Conta criada. Confirme seu e-mail para entrar.'}else{auth.classList.add('hide');$('loginTop').classList.remove('show');toast('Login realizado.')}}catch(e){errorBox.textContent=e.message||'Falha na autenticação.'}finally{$('submit').disabled=false;$('submit').textContent=signup?'Criar conta':'Entrar'}}
function newChat(){conversationId='adaptra-'+Date.now();history=[];chat.innerHTML='<section class="welcome"><div class="welcome-top"><div class="welcome-icon">✨</div><h1>Nova conversa 🚀</h1></div><p>Conversa limpa. O que vamos criar agora?</p></section>';toast('Nova conversa criada.')}
$('send').onclick=()=>busy&&controller?controller.abort():sendMessage();input.oninput=resize;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};$('newChat').onclick=newChat;$('mnew').onclick=newChat;
$('imageMode').onclick=()=>{image=true;$('imageMode').classList.add('active');$('chatMode').classList.remove('active');input.placeholder='Descreva a imagem que deseja criar...'};$('chatMode').onclick=()=>{image=false;$('chatMode').classList.add('active');$('imageMode').classList.remove('active');input.placeholder='Converse com a Adaptra...'};
$('memory').onclick=async()=>{let v=input.value.trim();if(!v)return toast('Digite o que devo lembrar.');try{let r=await api('/memory',{method:'POST',body:JSON.stringify({key:'nota',value:v})});let d=await r.json();if(!r.ok)throw Error(d.error);input.value='';resize();toast('Memória salva.')}catch(e){toast(e.message)}};
$('teach').onclick=()=>{input.value='Quero ensinar uma informação nova para você: ';input.focus();resize()};$('speak').onclick=()=>{if(!lastReply)return toast('Ainda não há resposta para falar.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lastReply);u.lang='pt-BR';speechSynthesis.speak(u)};$('attach').onclick=()=>toast('Anexos serão adicionados em breve.');
document.querySelectorAll('.quick').forEach(x=>x.onclick=()=>sendMessage(x.dataset.msg));
$('menuBtn').onclick=()=>{$('menu').classList.add('open');$('menuBg').classList.add('open')};$('close').onclick=()=>{$('menu').classList.remove('open');$('menuBg').classList.remove('open')};$('menuBg').onclick=()=>{$('menu').classList.remove('open');$('menuBg').classList.remove('open')};$('mstatus').onclick=async()=>{let ok=await health();toast(ok?'Backend online.':'Backend offline.')};$('mmem').onclick=()=>{input.value='Mostre minhas memórias salvas.';resize();input.focus()};
$('switch').onclick=()=>{signup=!signup;$('authTitle').textContent=signup?'Criar conta na Adaptra.AI':'Entrar na Adaptra.AI';$('authText').textContent=signup?'Crie sua conta para guardar conversas, memória e projetos.':'Entre para sincronizar sua conta, memória, conversas e projetos.';$('submit').textContent=signup?'Criar conta':'Entrar';$('switch').textContent=signup?'Já tenho conta — entrar':'Ainda não tenho conta — criar';errorBox.textContent=''};$('submit').onclick=authSubmit;$('loginTop').onclick=()=>auth.classList.remove('hide');$('apass').onkeydown=e=>{if(e.key==='Enter')authSubmit()};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function init(){await health();let {data:{session}}=await sb.auth.getSession();if(session?.user){auth.classList.add('hide');$('loginTop').classList.remove('show');$('profile').classList.add('show');$('email').textContent=session.user.email||'';$('mini').textContent=(session.user.email||'A')[0].toUpperCase();$('mini').classList.add('show')}else {auth.classList.remove('hide');$('loginTop').classList.add('show')};sb.auth.onAuthStateChange((_e,s)=>{if(s?.user){auth.classList.add('hide');$('loginTop').classList.remove('show');$('profile').classList.add('show');$('email').textContent=s.user.email||'';$('mini').textContent=(s.user.email||'A')[0].toUpperCase();$('mini').classList.add('show')}})}init();resize();
</script></body></html>
