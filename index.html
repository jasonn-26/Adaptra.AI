<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d16">
<title>adapt.AI 3.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d16;color:#f5f7fb;font-family:system-ui,Arial,sans-serif}
.app{height:100vh;display:flex;flex-direction:column;max-width:920px;margin:auto}
header{padding:14px 18px;border-bottom:1px solid #222b3a;background:#0e1420}
.logo{font-size:22px;font-weight:800}.logo span{color:#7181ff}.status{font-size:11px;color:#62e39a;margin-top:3px}
#chat{flex:1;overflow:auto;padding:18px 14px}.msg{max-width:86%;padding:12px 15px;margin:10px 0;border-radius:17px;line-height:1.45;white-space:pre-wrap}
.ai{background:#182130}.user{background:#3166e8;margin-left:auto}.info{max-width:100%;background:#111927;color:#aeb8c8;font-size:13px}
.composer{padding:10px;background:#0e1420;border-top:1px solid #222b3a}.box{display:flex;gap:7px;background:#182130;border:1px solid #303b4e;border-radius:16px;padding:7px}
textarea{flex:1;background:transparent;border:0;outline:0;color:white;resize:none;padding:10px;min-height:42px;max-height:130px}
button{border:0;border-radius:12px;background:#3166e8;color:white;padding:0 16px;font-size:18px}.tools{display:flex;gap:6px;margin-top:7px;overflow:auto}
.tool{background:#182130;color:#aeb8c8;font-size:11px;padding:8px 11px;white-space:nowrap}
.dots span{display:inline-block;animation:blink 1.1s infinite}.dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.2;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
@media(max-width:600px){.msg{max-width:92%}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🤖 adapt<span>.AI</span> 3.0</div><div class="status" id="status">● iniciando</div></header>
<div id="chat"></div>
<div class="composer">
<div class="box"><textarea id="input" placeholder="Pergunte alguma coisa..." rows="1"></textarea><button id="send">➤</button></div>
<div class="tools"><button class="tool" id="web">🌐 Web</button><button class="tool" id="teach">🧠 Ensinar</button><button class="tool" id="memory">📚 Memória</button><button class="tool" id="voice">🔊 Voz</button></div>
</div></div>
<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";
const MODEL="onnx-community/Qwen3-0.6B-ONNX",KEY="adaptAI3_memory";
const chat=document.querySelector("#chat"),input=document.querySelector("#input"),send=document.querySelector("#send"),status=document.querySelector("#status");
let memory=JSON.parse(localStorage.getItem(KEY)||"{}"),generator=null,busy=false,last="",history=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const save=()=>localStorage.setItem(KEY,JSON.stringify(memory));
function add(text,type="ai"){const d=document.createElement("div");d.className="msg "+type;d.innerHTML=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function clean(s){return String(s||"").replace(/<think>[\s\S]*?<\/think>/gi,"").replace(/<\|im_end\|>/g,"").replace(/^assistant\s*[:\-]?\s*/i,"").trim()}
function shortText(s,q){s=clean(s);if(!s)return"Não consegui responder.";if(!/explique|detalhe|detalhadamente|mais detalhes|texto longo/i.test(q)){const p=s.split(/(?<=[.!?])\s+/);if(p.length>3)s=p.slice(0,3).join(" ")}return s}
function calc(q){if(!/^[0-9+\-*/().,%\s]+$/.test(q))return null;try{const v=Function('"use strict";return ('+q.replace(/,/g,".")+')')();return Number.isFinite(v)?"🧮 "+v:null}catch{return null}}
async function webSearch(q){const u="https://pt.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(q)+"&gsrlimit=3&prop=extracts&exintro=1&explaintext=1&format=json&origin=*";const r=await fetch(u);if(!r.ok)throw Error();const d=await r.json(),p=d?.query?.pages?Object.values(d.query.pages).find(x=>x.extract):null;if(!p)throw Error();const t=p.extract.trim().split(/(?<=[.!?])\s+/).slice(0,3).join(" ");memory[norm(q)]=t;save();return"🌐 "+t}
async function generate(q){if(!generator)return null;const mem=Object.entries(memory).slice(-15).map(([k,v])=>"- "+k+": "+v).join("\n");const m=[{role:"system",content:"Você é a adapt.AI. Responda em português do Brasil. Perguntas simples: 1 ou 2 frases. Só seja detalhada quando pedirem. Não invente."+(mem?"\nMemória:\n"+mem:"")}];history.slice(-6).forEach(x=>m.push(x));m.push({role:"user",content:q});const o=await generator(m,{max_new_tokens:180,do_sample:true,temperature:.65,top_p:.9,repetition_penalty:1.08});const g=o?.[0]?.generated_text;let a=Array.isArray(g)?g[g.length-1]?.content:g;a=shortText(a,q);history.push({role:"user",content:q},{role:"assistant",content:a});if(history.length>8)history.splice(0,2);return a}
async function answer(q){const n=norm(q);if(memory[n])return"🧠 "+memory[n];if(["oi","ola","olá"].includes(n))return"Olá! 👋 Como posso ajudar?";if(n.includes("seu nome"))return"Eu sou a adapt.AI. 🤖";const c=calc(q);if(c)return c;if(n.startsWith("aprenda:")){const p=q.slice(8).split("|");if(p.length<2)return"Use: aprenda: pergunta | resposta";memory[norm(p[0])]=p.slice(1).join("|").trim();save();return"🧠 Aprendi e salvei."}const current=["hoje","agora","atual","atualmente","2026","notícia","noticia","preço","preco"],factual=["quem ","quando ","onde ","qual ","capital ","história ","historia ","o que é ","o que e "];if(current.some(x=>n.includes(x))||factual.some(x=>n.includes(x))){try{return await webSearch(q)}catch{}}const local=await generate(q);if(local)return local;try{return await webSearch(q)}catch{}return"Não consegui responder agora."}
async function sendMsg(q=input.value.trim()){if(!q||busy)return;add(esc(q),"user");input.value="";input.style.height="auto";busy=true;send.disabled=true;const t=add('<span class="dots">Pensando <span>•</span><span>•</span><span>•</span></span>');try{const a=await answer(q);t.textContent="";let i=0;const timer=setInterval(()=>{t.textContent+=a.charAt(i++);chat.scrollTop=chat.scrollHeight;if(i>=a.length)clearInterval(timer)},8);last=a}catch{t.textContent="Não consegui responder. Tente novamente."}busy=false;send.disabled=false;input.focus()}
send.onclick=()=>sendMsg();input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,130)+"px"});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg()}});
document.querySelector("#teach").onclick=()=>{const q=prompt("O que devo aprender?");if(!q)return;const a=prompt("Qual é a resposta?");if(!a)return;memory[norm(q)]=a;save();add("🧠 Aprendi e salvei.")};
document.querySelector("#memory").onclick=()=>add(Object.keys(memory).length?`📚 Tenho ${Object.keys(memory).length} conhecimento(s) salvo(s).`:"📚 Minha memória está vazia.");
document.querySelector("#web").onclick=()=>{const q=input.value.trim()||prompt("Pesquisar o quê?");if(q)window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank")};
document.querySelector("#voice").onclick=()=>{if(!("speechSynthesis"in window)||!last)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(last);u.lang="pt-BR";u.rate=.9;u.pitch=1;speechSynthesis.speak(u)};
add("🚀 <b>adapt.AI 3.0</b><br><br>Respostas curtas, memória, pesquisa na internet e voz. O cérebro local está sendo preparado.","info");
(async()=>{try{status.textContent="● carregando cérebro local";const gpu="gpu"in navigator;generator=await pipeline("text-generation",MODEL,{device:gpu?"webgpu":"wasm",dtype:gpu?"q4f16":"q4"});status.textContent=gpu?"● ONLINE • WebGPU":"● ONLINE • CPU";add("🧠 Cérebro local pronto.","info")}catch(e){console.warn(e);status.textContent="● WEB + modo leve";add("🌐 O cérebro local não terminou de carregar. A pesquisa web continua disponível.","info")}})();
</script>
</body>
</html>
