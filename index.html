<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>adapt.AI 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080c14;color:#fff;font-family:Arial,sans-serif}
.app{height:100vh;max-width:760px;margin:auto;display:flex;flex-direction:column}
header{padding:14px 16px;background:#111827;border-bottom:1px solid #283449}
.logo{font-size:24px;font-weight:700}.logo b{color:#4f8cff}
.status{font-size:11px;color:#55e891;margin-top:4px}
#chat{flex:1;overflow:auto;padding:14px}
.msg{max-width:90%;padding:12px 14px;margin:9px 0;border-radius:16px;white-space:pre-wrap;line-height:1.5}
.user{margin-left:auto;background:#2864f0}.ai{background:#1d2635}
.info{max-width:100%;background:#141c29;color:#aeb8c8;font-size:12px}
.bottom{padding:9px;background:#111827;border-top:1px solid #283449}
.row{display:flex;gap:7px}input{flex:1;min-width:0;padding:14px;border-radius:13px;border:1px solid #37455c;background:#202b3c;color:#fff;font-size:16px;outline:none}
button{border:0;border-radius:13px;background:#2864f0;color:#fff;padding:0 16px;font-size:15px}
button:disabled{opacity:.5}.tools{display:flex;gap:6px;margin-top:7px}.tool{flex:1;padding:9px 4px;background:#202b3c;font-size:11px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">🤖 adapt<b>.AI</b></div>
  <div id="status" class="status">● preparando...</div>
</header>
<div id="chat"></div>
<div class="bottom">
  <div class="row">
    <input id="input" placeholder="Pergunte alguma coisa..." autocomplete="off">
    <button id="send">➤</button>
  </div>
  <div class="tools">
    <button class="tool" id="teach">🧠 Ensinar</button>
    <button class="tool" id="web">🌐 Web</button>
    <button class="tool" id="voice">🔊 Voz</button>
    <button class="tool" id="memory">📚 Memória</button>
  </div>
</div>
</div>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

const MODEL = "onnx-community/Qwen3-0.6B-ONNX";
const MEMORY_KEY = "adaptAI_memory_v2";
const MAX_MEMORY = 300;
const MAX_TURNS = 6;

const chat = document.querySelector("#chat");
const input = document.querySelector("#input");
const send = document.querySelector("#send");
const status = document.querySelector("#status");

let memory = JSON.parse(localStorage.getItem(MEMORY_KEY) || "{}");
let history = [];
let generator = null;
let busy = false;
let lastAnswer = "";

function show(text, cls){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
}

function saveMemory(){
  let keys = Object.keys(memory);
  while(keys.length > MAX_MEMORY){
    delete memory[keys.shift()];
  }
  localStorage.setItem(MEMORY_KEY, JSON.stringify(memory));
}

function memoryContext(){
  const keys = Object.keys(memory).slice(-20);
  if(!keys.length) return "";
  return "\nMEMÓRIA DO USUÁRIO:\n" +
    keys.map(k => "- " + k + ": " + memory[k]).join("\n");
}

function cleanAnswer(s){
  s = String(s || "")
    .replace(/<think>[\s\S]*?<\/think>/gi,"")
    .replace(/<\|im_end\|>/g,"")
    .replace(/^assistant\s*[:\-]?\s*/i,"")
    .trim();
  return s || "Não consegui gerar uma resposta.";
}

async function loadModel(){
  try{
    status.textContent = "● baixando cérebro local...";
    show("⏳ Primeira vez: o modelo será baixado. O arquivo q4f16 do modelo é cerca de 570 MB; o uso de RAM durante a execução pode ser maior.", "info");

    const webgpu = "gpu" in navigator;
    generator = await pipeline("text-generation", MODEL, {
      device: webgpu ? "webgpu" : "wasm",
      dtype: webgpu ? "q4f16" : "q4"
    });

    status.textContent = webgpu ? "● ONLINE • WEBGPU" : "● ONLINE • CPU";
    show("🧠 Cérebro local carregado. Posso conversar, lembrar o que você ensinar e pesquisar na web.", "info");
  }catch(e){
    console.error(e);
    status.textContent = "● erro ao carregar";
    show("❌ Não consegui carregar o modelo. Abra o Console do navegador/Acode para ver o erro. Verifique a internet e tente novamente.", "info");
  }
}

async function generate(userText){
  if(!generator) return "⏳ Meu cérebro ainda está carregando.";

  const messages = [{
    role:"system",
    content:
      "Você é adapt.AI, uma assistente brasileira. Responda em português do Brasil. " +
      "Se não souber algo, seja honesta. Não invente fatos." +
      memoryContext()
  }];

  for(const x of history.slice(-MAX_TURNS * 2)) messages.push(x);
  messages.push({role:"user", content:userText});

  const out = await generator(messages, {
    max_new_tokens: 256,
    do_sample: true,
    temperature: 0.7,
    top_p: 0.9,
    repetition_penalty: 1.08
  });

  const generated = out?.[0]?.generated_text;
  let answer = "";

  if(Array.isArray(generated)){
    answer = generated[generated.length - 1]?.content || "";
  }else{
    answer = generated || "";
  }

  answer = cleanAnswer(answer);

  history.push({role:"user",content:userText});
  history.push({role:"assistant",content:answer});
  if(history.length > MAX_TURNS * 2) history.splice(0,2);

  return answer;
}

async function webSearch(query){
  const q = norm(query);

  // Correções para perguntas que costumam dar resultados ruins.
  let search = q;
  if(q.includes("quem descobriu o brasil")) search = "Descobrimento do Brasil";
  else if(q.includes("quem foi pedro alvares cabral")) search = "Pedro Álvares Cabral";
  else if(q.includes("quem foi einstein")) search = "Albert Einstein";
  else if(q.includes("capital do brasil")) search = "Brasília";

  const url =
    "https://pt.wikipedia.org/w/api.php?action=query&generator=search" +
    "&gsrsearch=" + encodeURIComponent(search) +
    "&gsrlimit=5&prop=extracts&exintro=1&explaintext=1&format=json&origin=*";

  const r = await fetch(url);
  if(!r.ok) throw new Error("internet");

  const data = await r.json();
  const pages = data?.query?.pages ? Object.values(data.query.pages) : [];
  const page = pages.find(p => p.extract && p.extract.length > 80);

  if(!page) return "🤔 Não encontrei uma fonte adequada para essa pergunta.";

  let text = page.extract.trim();
  if(text.length > 1600) text = text.slice(0,1600) + "...";

  memory[norm(query)] = text;
  saveMemory();

  return "🌐 Encontrei na internet:\n\n" + text + "\n\n🧠 Salvei um resumo na memória.";
}

async function answer(text){
  const n = norm(text);

  if(memory[n]) return "🧠 " + memory[n];

  if(n === "oi" || n === "ola" || n === "olá")
    return "Olá! 👋 Eu sou a adapt.AI. O que você quer fazer?";

  if(n.includes("qual e seu nome") || n.includes("seu nome"))
    return "Meu nome é adapt.AI. 🤖";

  if(n.startsWith("aprenda:")){
    const parts = text.slice(8).split("|");
    if(parts.length < 2) return "Use: aprenda: pergunta | resposta";
    const key = norm(parts[0]);
    const value = parts.slice(1).join("|").trim();
    if(!key || !value) return "A pergunta e a resposta precisam ser preenchidas.";
    memory[key] = value;
    saveMemory();
    return "🧠 Aprendi e salvei essa informação.";
  }

  // Para fatos simples e perguntas com chance de exigir atualização,
  // pesquisa na web antes de pedir ao modelo uma resposta.
  const webTriggers = [
    "quem","quando","onde","qual","quanto","como",
    "historia","história","preco","preço","noticia","notícia",
    "hoje","atual","atualmente","2026","pesquise","pesquisar"
  ];

  if(webTriggers.some(x => n.includes(x))){
    try{
      return await webSearch(text);
    }catch(e){
      console.warn("Busca web falhou", e);
    }
  }

  return await generate(text);
}

async function sendMessage(){
  const text = input.value.trim();
  if(!text || busy) return;

  show(text,"user");
  input.value = "";
  busy = true;
  send.disabled = true;

  const thinking = show("🧠 pensando...","ai");

  try{
    lastAnswer = await answer(text);
    thinking.remove();
    show(lastAnswer,"ai");
  }catch(e){
    console.error(e);
    thinking.remove();
    show("❌ Ocorreu um erro. Tente novamente.","ai");
  }

  busy = false;
  send.disabled = false;
  input.focus();
}

document.querySelector("#send").onclick = sendMessage;
input.addEventListener("keydown",e => {
  if(e.key === "Enter") sendMessage();
});

document.querySelector("#teach").onclick = () => {
  const q = prompt("O que você quer ensinar?");
  if(!q) return;
  const a = prompt("Qual resposta devo guardar?");
  if(!a) return;
  memory[norm(q)] = a;
  saveMemory();
  show("🧠 Aprendi e salvei na memória.","ai");
};

document.querySelector("#web").onclick = () => {
  const q = prompt("O que você quer pesquisar no Google?");
  if(!q) return;
  window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank");
};

document.querySelector("#voice").onclick = () => {
  if(!lastAnswer) return;
  if(!("speechSynthesis" in window)){
    alert("Seu navegador não suporta voz.");
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(lastAnswer);
  u.lang = "pt-BR";
  speechSynthesis.speak(u);
};

document.querySelector("#memory").onclick = () => {
  const keys = Object.keys(memory);
  if(!keys.length){
    show("📚 Minha memória está vazia.","ai");
    return;
  }
  show("📚 Conhecimentos salvos: " + keys.length + "\n\n" +
    keys.slice(-25).map(k => "• " + k).join("\n"),"ai");
};

show("🚀 adapt.AI 2.0\n\nEstou preparando meu cérebro local. Na primeira vez, aguarde o download do modelo.","info");
loadModel();
</script>
</body>
</html>
