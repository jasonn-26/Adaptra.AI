<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070b14"><title>Adaptra.AI 3.6</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#070b14;color:#f4f7ff;font-family:system-ui,Arial;overflow:hidden}button,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;max-width:1000px;margin:auto;display:flex;flex-direction:column;background:radial-gradient(circle at 20% 0%,#18234d55,transparent 30%),#070b14}.header{height:65px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #1e2a40;background:#070b14ee}.brand{display:flex;gap:10px;align-items:center}.logo,.avatar{display:grid;place-items:center;background:linear-gradient(135deg,#4d6fff,#855cff);font-weight:900}.logo{width:40px;height:40px;border-radius:13px}.name{font-weight:800}.name b{color:#7188ff}.status{font-size:10px;color:#35d58a}.actions{display:flex;gap:7px}.icon,.tool,.attach,.voice,.send{border:1px solid #243149;background:#111a2b;color:#e8edfa;border-radius:13px}.icon{width:40px;height:40px}.chat{flex:1;overflow:auto;padding:15px 10px 185px}.welcome{max-width:700px;margin:10px auto;padding:20px;border:1px solid #536dff33;border-radius:22px;background:#0e1727}.welcome h1{font-size:23px;margin:0}.welcome h1 span{color:#7d8cff}.welcome p{color:#8995aa;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick{padding:12px;text-align:left;background:#101a2b;color:#dbe3f2;border:1px solid #243149;border-radius:14px}.quick strong,.quick small{display:block}.quick small{color:#8995aa;margin-top:3px}.row{display:flex;gap:8px;margin:12px 0}.row.user{justify-content:flex-end}.avatar{width:35px;height:35px;min-width:35px;border-radius:12px}.bubble{max-width:85%;padding:12px 14px;border-radius:18px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;background:#111c2e;border:1px solid #ffffff0d}.user .bubble{background:linear-gradient(135deg,#4568ee,#7158e9)}.composer{position:fixed;left:0;right:0;bottom:0;padding:8px 8px max(8px,env(safe-area-inset-bottom));background:linear-gradient(#070b1400,#070b14 25%);z-index:20}.box{max-width:1000px;margin:auto;display:flex;gap:6px;padding:7px;border:1px solid #26344b;border-radius:21px;background:#0d1422}.attach,.voice,.send{width:43px;height:43px;min-width:43px}.send{background:linear-gradient(135deg,#4d6fff,#855cff);border:0}.stop{background:#ff5571!important}.input{flex:1;min-width:0;max-height:130px;min-height:43px;padding:11px 5px;resize:none;border:0;outline:0;background:transparent;color:white}.tools{max-width:1000px;margin:7px auto 0;display:flex;gap:6px;overflow:auto}.tool{white-space:nowrap;padding:7px 10px;font-size:11px}.tool.active{border-color:#536dff;background:#18264a}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#111b2c;border:1px solid #2b3a54;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;z-index:100}.toast.show{opacity:1}.menu-bg{position:fixed;inset:0;background:#0008;display:none;z-index:40}.menu{position:fixed;left:0;top:0;bottom:0;width:min(320px,88vw);background:#0b1220;padding:18px;transform:translateX(-105%);transition:.2s;z-index:50}.menu.open{transform:none}.menu-bg.open{display:block}.menu button{display:block;width:100%;padding:13px;margin:5px 0;text-align:left;background:transparent;border:0;border-radius:12px;color:#dce4f4}.menu button:hover{background:#131f34}.image{display:block;max-width:520px;width:100%;margin-top:8px;border-radius:15px}@media(max-width:500px){.grid{grid-template-columns:1fr}.welcome{padding:17px}.bubble{max-width:90%}}
</style></head><body><div class="app"><header class="header"><div class="brand"><div class="logo">A</div><div><div class="name">Adaptra<b>.AI</b> <small>3.6</small></div><div class="status" id="status">● conectando</div></div></div><div class="actions"><button class="icon" id="new">＋</button><button class="icon" id="menuBtn">☰</button></div></header><main class="chat" id="chat"><section class="welcome" id="welcome"><h1>Olá, <span>Jheymison</span> 👋</h1><p>Adaptra.AI 3.6 conectada ao seu backend.</p><div class="grid"><button class="quick" data-msg="Quero criar um projeto novo.">🚀<strong>Criar projeto</strong><small>Começar uma ideia</small></button><button class="quick" data-msg="Me ajude a criar um jogo 2D.">🎮<strong>Criar jogo</strong><small>Desenvolvimento</small></button><button class="quick" data-msg="Explique programação de forma simples.">💻<strong>Programar</strong><small>Ajuda com código</small></button><button class="quick" data-msg="Me dê ideias para um projeto.">💡<strong>Ideias</strong><small>Brainstorm</small></button></div></section></main><div class="composer"><div class="box"><button class="attach" id="attach">＋</button><textarea class="input" id="input" rows="1" placeholder="Converse com a Adaptra..."></textarea><button class="voice" id="voice">🎤</button><button class="send" id="send">➤</button></div><div class="tools"><button class="tool active" id="chatMode">🧠 Adaptra</button><button class="tool" id="imageMode">🎨 Imagem</button><button class="tool" id="memory">💾 Memória</button><button class="tool" id="teach">🧠 Ensinar</button><button class="tool" id="web">🌐 Web</button><button class="tool" id="speak">🔊 Falar</button></div></div><div class="menu-bg" id="menuBg"></div><aside class="menu" id="menu"><button id="close">✕ Fechar</button><button id="menuNew">💬 Nova conversa</button><button id="menuMemory">🧠 Memória</button><button id="creator">👤 Sobre o criador</button><button id="test">🟢 Testar backend</button></aside><div class="toast" id="toast"></div></div><script>
(() => {
'use strict';
const API='https://adaptra-backend.onrender.com', $=id=>document.getElementById(id);
const chat=$('chat'),input=$('input'),send=$('send'),status=$('status'),toast=$('toast'),menu=$('menu'),menuBg=$('menuBg');
let busy=false,controller=null,imageMode=false,lastReply='';let history=JSON.parse(localStorage.getItem('adaptra36_history')||'[]');let memories=JSON.parse(localStorage.getItem('adaptra36_memory')||'{}');
function msg(t,type='ai'){const r=document.createElement('div');r.className='row '+type;const a=document.createElement('div');a.className='avatar';a.textContent=type==='user'?'J':'A';const b=document.createElement('div');b.className='bubble';b.textContent=t;r.append(a,b);chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return b}

function renderHistory(){
  if(!Array.isArray(history) || !history.length) return;
  const welcome = document.getElementById('welcome');
  if(welcome) welcome.style.display='none';

  for(let i=0;i<history.length;i++){
    const item=history[i];
    if(!item || !item.role || !item.content) continue;
    msg(String(item.content), item.role==='user'?'user':'ai');
  }
}

function info(t){msg(t,'ai')}
function show(t){toast.textContent=t;toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('show'),2500)}
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px'}
async function health(){try{const r=await fetch(API+'/health',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);await r.text();status.textContent='● ONLINE';status.style.color='#35d58a';return true}catch(e){status.textContent='● OFFLINE';status.style.color='#ff5571';console.error(e);return false}}
async function ask(text){controller=new AbortController();const r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,conversationId:'adaptra-main',history:history.slice(-10)}),signal:controller.signal});const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{throw Error('Backend retornou algo que não é JSON.')}if(!r.ok)throw Error(d.error||d.details||'HTTP '+r.status);const answer=String(d.reply??d.message??d.response??'').replace(/<think>[\s\S]*?<\/think>/gi,'').trim();if(!answer)throw Error('O backend não enviou a resposta.');return answer}
async function generate(text){
  controller=new AbortController();

  const r=await fetch(API+'/generate',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({prompt:text}),
    signal:controller.signal
  });

  const type=(r.headers.get('content-type')||'').toLowerCase();

  if(!r.ok){
    let message='Erro na geração da imagem.';
    try{
      const raw=await r.text();
      try{
        const d=JSON.parse(raw);
        message=d.error||d.details||d.message||message;
      }catch{
        if(raw) message=raw.slice(0,300);
      }
    }catch{}
    if(r.status===404){
      throw Error('A rota /generate ainda não existe no backend. Adicione a rota de geração de imagem no Render.');
    }
    throw Error(message);
  }

  if(type.includes('image/')){
    return {
      kind:'blob',
      blob:await r.blob()
    };
  }

  let data;
  try{
    data=await r.json();
  }catch{
    throw Error('O backend respondeu, mas não enviou uma imagem válida.');
  }

  const url=data.url||data.imageUrl||data.image||data.image_url;
  if(url){
    return {kind:'url',url:String(url)};
  }

  const b64=data.b64_json||data.base64;
  if(b64){
    return {
      kind:'url',
      url:'data:image/png;base64,'+String(b64)
    };
  }

  throw Error(data.error||data.details||'O backend não retornou uma imagem.');
}
async function sendMessage(){const text=input.value.trim();if(!text||busy)return;busy=true;status.textContent='● processando';msg(text,'user');input.value='';resize();send.textContent='■';send.classList.add('stop');const thinking=msg('...','ai');try{if(imageMode){const result=await generate(text);
      thinking.parentElement?.remove();

      const b=msg('🎨 Imagem criada:','ai');
      const img=document.createElement('img');
      img.className='image';
      img.alt=text;

      if(result.kind==='blob'){
        img.src=URL.createObjectURL(result.blob);
      }else{
        img.src=result.url;
      }

      b.appendChild(img);
      return}const answer=await ask(text);thinking.parentElement?.remove();const b=msg('','ai');lastReply=answer;history.push({role:'user',content:text},{role:'assistant',content:answer});history=history.slice(-20);localStorage.setItem('adaptra36_history',JSON.stringify(history));for(let i=0;i<answer.length&&busy;i++){b.textContent+=answer[i];await new Promise(r=>setTimeout(r,7))}b.textContent=answer}catch(e){thinking.parentElement?.remove();if(e.name==='AbortError')info('⏹️ Resposta interrompida.');else{info('❌ '+e.message);show(e.message)}}finally{busy=false;controller=null;send.textContent='➤';send.classList.remove('stop');await health();input.focus()}}
function stop(){if(controller)controller.abort()}
function newChat(){if(controller)controller.abort();busy=false;history=[];lastReply='';localStorage.removeItem('adaptra36_history');chat.innerHTML='';const s=document.createElement('section');s.className='welcome';s.innerHTML='<h1>Nova conversa ✨</h1><p>Como posso ajudar?</p>';chat.appendChild(s);show('Nova conversa iniciada')}
function setImage(v){imageMode=v;$('chatMode').classList.toggle('active',!v);$('imageMode').classList.toggle('active',v);input.placeholder=v?'Descreva a imagem...':'Converse com a Adaptra...';show(v?'🎨 Modo imagem':'🧠 Modo Adaptra')}
$('send').onclick=()=>busy?stop():sendMessage();$('new').onclick=newChat;$('menuBtn').onclick=()=>{menu.classList.add('open');menuBg.classList.add('open')};$('close').onclick=()=>{menu.classList.remove('open');menuBg.classList.remove('open')};menuBg.onclick=()=>{menu.classList.remove('open');menuBg.classList.remove('open')};$('menuNew').onclick=()=>{menu.classList.remove('open');menuBg.classList.remove('open');newChat()};$('chatMode').onclick=()=>setImage(false);$('imageMode').onclick=()=>setImage(true);$('attach').onclick=()=>show('📎 Ferramentas extras em breve');$('memory').onclick=()=>info(Object.keys(memories).length?'💾 '+Object.keys(memories).length+' memória(s) salva(s).':'💾 Memória vazia.');$('teach').onclick=()=>{const q=prompt('O que ensinar?');if(!q)return;const a=prompt('Qual resposta memorizar?');if(!a)return;memories[q.toLowerCase()]=a;localStorage.setItem('adaptra36_memory',JSON.stringify(memories));info('🧠 Aprendi e salvei localmente.')};$('web').onclick=()=>{const q=input.value.trim();if(!q)return show('Digite o que pesquisar.');window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank')};$('speak').onclick=()=>{if(!lastReply)return show('Ainda não há resposta.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lastReply);u.lang='pt-BR';speechSynthesis.speak(u)};$('creator').onclick=()=>info('👤 Meu criador é Jheymison.');$('test').onclick=async()=>info(await health()?'🟢 Backend online.':'🔴 Backend offline.');$('voice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return show('🎤 Voz não disponível.');const r=new R();r.lang='pt-BR';r.onresult=e=>{input.value=e.results[0][0].transcript;resize()};r.onerror=()=>show('Não consegui ouvir você.');try{r.start()}catch{}};input.oninput=resize;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};document.addEventListener('click',e=>{const q=e.target.closest('.quick');if(q){input.value=q.dataset.msg;resize();sendMessage()}});window.onerror=(m)=>show('Erro no JavaScript: '+m);renderHistory(); health().then(ok=>info(ok?'🟢 Adaptra 3.6 conectada ao backend.':'🔴 Backend não acessível.'));resize();
})();
</script></body></html>
